# Render blueprint for the public demo of the feedback web interface.
#
# The demo runs on SYNTHETIC data by design, and contains no institutional or
# personal data: no real export is committed (web-interface/data/ is gitignored),
# so taxonomy.py falls back to a synthetic structure, deterministic scores, and a
# small corpus of fabricated comments (web-interface/models/demo_comments.json).
#
# FEEDBACK_CONTENT_SYNTHETIC is deliberately NOT set here, and must not be. It is
# the only switch that can clear the "date demonstrative" badge, and every number
# on this deployment is invented -- scores, teacher names, student comments. The
# provenance check fails closed (taxonomy.py: _content_is_generated), so leaving
# it unset is what keeps the badge on. Setting it to "0" here would make a public
# dashboard assert that fabricated rankings about named people are real.
#
# The sentiment labels on /comentarii carry their own badge for a separate reason:
# they are a MODEL'S ESTIMATE, not something a student wrote, and that stays true
# even if this demo is ever pointed at real data.
services:
  - type: web
    name: feedback-upb-demo
    runtime: python
    plan: free
    rootDir: web-interface
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FEEDBACK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7

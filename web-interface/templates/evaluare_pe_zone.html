{% extends "base.html" %}
{% block title %} — Evaluare pe zone{% endblock %}
{% block content %}
<h1>Evaluare pe zone (benzi de scor)</h1>

<form method="get">
  <label>Entitate:
    <select name="entitate" onchange="this.form.submit()">
      <option value="curs" {{ "selected" if entitate == "curs" else "" }}>Cursuri</option>
      <option value="titular" {{ "selected" if entitate == "titular" else "" }}>Titulari</option>
      <option value="asistent" {{ "selected" if entitate == "asistent" else "" }}>Asistenți</option>
    </select>
  </label>
</form>

<table>
  <thead><tr><th>Bandă</th><th>Nr.</th><th>%</th></tr></thead>
  <tbody>
    {% for row in rows %}
    <tr><td>{{ row.banda }}</td><td>{{ row.num }}</td><td>{{ "%.1f"|format(row.pct) }}%</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
